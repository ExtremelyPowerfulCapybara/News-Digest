services:

  # ── App (run on demand, never long-running) ──────────────────────────────
  # Main pipeline:      docker compose run --rm app python main.py
  # Telegram handler:   docker compose run --rm app python telegram_handler.py
  app:
    build: .
    working_dir: /app/bot
    env_file: bot/.env
    volumes:
      - ./docs:/app/docs
      - ./digests:/app/digests
      - ./data:/app/data
      - ./tmp_images:/app/tmp_images
      - ./bot/.telegram_offset:/app/bot/.telegram_offset

  # ── nginx — serves docs/ as the public archive ───────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docs:/var/www/newsletter:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── cloudflared — exposes nginx via Cloudflare Tunnel ────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - nginx
